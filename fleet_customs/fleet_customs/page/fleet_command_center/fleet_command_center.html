<div class="customs-command-center-wrapper">
    <!-- HUD Metrics Bar -->
    <div class="hud-metrics-container">
        <div class="metric-card metric-total">
            <div class="metric-val" id="count-total">0</div>
            <div class="metric-label">🚛 Total Armada</div>
        </div>
        <div class="metric-card metric-safe">
            <div class="metric-val" id="count-safe">0</div>
            <div class="metric-label">✅ Aman (Safe)</div>
        </div>
        <div class="metric-card metric-warning">
            <div class="metric-val" id="count-warning">0</div>
            <div class="metric-label">⚠️ Perhatian (Warning/ETA)</div>
        </div>
        <div class="metric-card metric-breach">
            <div class="metric-val" id="count-breach">0</div>
            <div class="metric-label">🔴 Pelanggaran (Breach/Tamper)</div>
        </div>
        <div class="metric-card metric-breakdown">
            <div class="metric-val" id="count-breakdown">0</div>
            <div class="metric-label">🔧 Breakdown / Mogok</div>
        </div>
        <div class="metric-card metric-emergency">
            <div class="metric-val" id="count-emergency">0</div>
            <div class="metric-label">🆘 Sinyal Darurat (Panic)</div>
        </div>
    </div>

    <!-- Map & Fleet Split View -->
    <div class="main-split-view">
        <!-- Peta Interaktif -->
        <div class="map-section">
            <div class="map-toolbar">
                <button class="btn btn-default btn-xs" id="btn-toggle-heatmap">🔥 Toggle Heatmap Insiden</button>
                <button class="btn btn-default btn-xs" id="btn-reset-map">🎯 Reset View</button>
                <span class="toolbar-info" id="corridor-active-indicator" style="display:none; color:#2196F3; font-weight:600;">
                    🗺️ Koridor Aktif Ditampilkan
                </span>
            </div>
            <div id="command-center-map" style="height: 600px; width: 100%; border-radius: 8px;"></div>
        </div>

        <!-- Sidebar List Armada & Audit Log -->
        <div class="sidebar-section">
            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <button class="tab-btn active" data-filter="all">Semua</button>
                <button class="tab-btn" data-filter="alert">Pelanggaran</button>
                <button class="tab-btn" data-filter="breakdown">Breakdown</button>
                <button class="tab-btn" data-filter="emergency">Darurat</button>
            </div>

            <!-- List Cards Armada -->
            <div class="fleet-cards-scroll" id="fleet-card-container">
                <div class="text-muted text-center" style="padding: 20px;">Memuat data armada...</div>
            </div>

            <!-- Realtime Audit Log Feed -->
            <div class="audit-feed-section">
                <h6>⚡ Live Audit Incident Feed</h6>
                <div class="table-responsive" style="max-height: 180px; overflow-y: auto;">
                    <table class="table table-condensed table-striped" style="font-size: 11px;">
                        <thead>
                            <tr>
                                <th>Jam</th>
                                <th>Severity</th>
                                <th>Trip</th>
                                <th>Insiden</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="audit-log-body">
                            <!-- Injected by WebSocket -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
