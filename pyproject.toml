[project]
name = "fleet_customs"
authors = [
    { name = "anhar91", email = "anhar91@example.com"}
]
description = "Customs Fleet Management and e-Seal System"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fleet_customs*"]
